[project]
name = "ha-device-links"
version = "0.0.1"
description = "Home Assistant integration for Z-Wave associations, Zigbee bindings and Matter bindings"
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["custom_components", "tests", "tools"]

[tool.ruff.lint]
select = [
    "A", "ASYNC", "B", "C4", "D", "E", "F", "I", "ICN", "INP", "ISC", "LOG",
    "N", "PGH", "PIE", "PL", "PT", "PTH", "RET", "RSE", "RUF", "SIM", "SLF",
    "T20", "TID", "TRY", "UP", "W",
]
ignore = ["D203", "D213", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004", "SLF001"]
"tools/*" = ["T20"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_generics = true
packages = ["custom_components.device_links"]

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "live: talks to a real Home Assistant instance. Never runs in CI.",
]

[tool.coverage.run]
source = ["custom_components/device_links"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
